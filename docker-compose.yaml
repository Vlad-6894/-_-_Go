services:

  security-golang-app:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/Dockerfile
    container_name: application-golang
    environment:
      - HTTP_SERVER_ADDRR=:6060
      - HTTP_SERVER_SHUTDOWN_TIMEOUT=${HTTP_SERVER_SHUTDOWN_TIMEOUT}
      - HTTP_SERVER_CERT_FILE=${HTTP_SERVER_CERT_FILE}
      - HTTP_SERVER_KEY_FILE=${HTTP_SERVER_KEY_FILE}
      - POSTGRES_HOST=security-postgres-db
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
      - ./certs:/app/certs:ro
    ports:
      - "6060:6060"

  security-postgres-db:
    image: postgres:18.1-bookworm
    container_name: postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pg_data:/var/lib/postgresql:z
    restart: always
  
  security-postgres-db-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  
  security-postgres-port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:couriers-postgres-db
    ports:
      - "127.0.0.1:5432:5432"